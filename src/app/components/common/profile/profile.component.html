<header class="header" id="header">
    <nav class="nav container main-header pb-3">
        <!-- <a href="#" class="nav__logo">FundBook</a> -->
        <div class="main-profile-div">
            <div class="row py-2 mb-2" style="background: #fff; box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;">
                <div class="col-2"><span (click)="BackToDashboard();"><i class="bi bi-chevron-left ms-1"></i></span></div>
                <div class="col-8 text-center"><span class="page-head">Profile</span></div>
                <div class="col-2"></div>
            </div>
            <div class="row p-1">
                <div class="col-12 pt-2">
                    <div class="profile-img">
                        <img src="../../../assets/images/profile.png" alt="user">
                    </div>
                </div>
                <div class="col-12 text-center"><span class="user-name">{{userDeatilInfo.FullName}}</span></div>
                <div class="col-12 px-2 mb-2 text-start">
                    <div class="menu-info ps-2">Personal Info</div>
                    <ul class="menu-ul-info">
                        <li class="menu-li-info b-bottom" (click)="onClickUpdateUserName();"><span><i class="bi bi-pencil-square me-1"></i>Change UserName</span></li>
                        <li class="menu-li-info" (click)="onClickUpdatePassword();"><span><i class="bi bi-person-lock me-1"></i>Update Password</span></li>
                    </ul>
                </div>
                <div class="col-12 px-2 mb-2 text-start">
                    <div class="menu-info ps-2">Backup</div>
                    <ul class="menu-ul-info">
                        <li class="menu-li-info b-bottom" (click)="onClickExportData();"><span><i class="bi bi-cloud-download me-1"></i>Export Data</span></li>
                        <li class="menu-li-info row">
                            <div class="col-6"><span><i class="bi bi-download me-1"></i>Export Expense</span></div>
                            <div class="col-6 d-flex justify-content-evenly">
                                <button class="btn btn-outline-danger btn-sm dn-btn" (click)="onClickDownload('pdf');"><i class="bi bi-filetype-pdf me-1"></i>PDF</button>
                                <button class="btn btn-outline-success btn-sm dn-btn" (click)="onClickDownload('excel');"><i class="bi bi-file-earmark-excel me-1"></i>EXCEL</button>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="col-12 px-2 mb-2 text-start">
                    <div class="menu-info ps-2">Amenities</div>
                    <ul class="menu-ul-info">
                        <li class="menu-li-info" (click)="onClickViewUsers();"><span><i class="bi bi-people me-1"></i>View All Users</span></li>
                    </ul>
                </div>
                <div class="col-12 px-2 mb-2 text-start">
                    <div class="menu-info ps-2">Security</div>
                    <ul class="menu-ul-info">
                        <li class="menu-li-info" (click)="onClickLogOut();"><span><i class="bi bi-box-arrow-right me-1"></i>Log Out</span></li>
                    </ul>
                </div>
                <div class="dev-credit">
                    <p class="m-0">Developed by<i class="bi bi-award-fill text-success mx-1"></i>Kamalesh</p>
                </div>
            </div>
        </div>

     </nav>
</header>
