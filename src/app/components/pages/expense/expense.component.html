<div class="card-body main-card">
    <div class="row py-2 mb-2 mx-2" style="box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;">
        <div class="col-2"><span (click)="BackToDashboard();"><i class="bi bi-chevron-left"></i></span></div>
        <div class="col-8 text-center"><span class="page-head">Expenses</span></div>
        <div class="col-2"></div>
    </div>
    <div class="row mx-2 align-items-center" style="box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;">
        <div class="col-12 mt-3">
            <form name="signin" #frmSearch="ngForm" (ngSubmit)="frmSearch.form.valid && onClickView()">
                <div class="row">
                    <!-- User ID Field -->
                    <div class="col-md-6 d-flex">
                        <div class="col-6 px-1">
                            <div class="form-group">
                                
                                <select class="form-control my-select" id="cmbMonth" name="cmbMonth" aria-label="User Type"
                                    #cmbMonth="ngModel" (change)="onChangeFilter()" 
                                    [ngClass]="{ 'is-invalid': frmSearch.submitted && cmbMonth.invalid  }"
                                    required="required" [(ngModel)]="record.MonthID">
                                    <option *ngFor="let m of AllMonths; let i = index "
                                        [value]="m.ID"
                                        [selected]="record.MonthID == m.ID">
                                        {{m.Description}}
                                    </option>
                                </select>
                                <label class="my-label" for="txtEntryDate">
                                    <i class="bi bi-ccalendar me-1"></i>Month<span class="star text-danger ms-1">*</span>
                                </label>
                                <div *ngIf="frmSearch.submitted && cmbMonth.invalid">
                                    <small class="text-danger" *ngIf="cmbMonth.errors?.['required']">
                                        <i class="bi bi-exclamation-circle me-1"></i>Please select month
                                    </small>
                                </div>
                            </div>
                        </div>
                        <div class="col-6 px-1">
                            <div class="switch_wrapper mt-2">
                                <label class="switch">
                                    <input type="checkbox" id="chkInActive" name="chkInActive" (change)="onChangeFilter()" [(ngModel)]="record.showOnlyMine" #chkInActive="ngModel">
                                    <span class="slider round" title="{{record.showOnlyMine==true?'Yes':'No'}}"></span>
                                </label>
                                <label for="chkInActive" class="switch_name ms-1">Only mine</label>
                            </div>
                        </div>
                    </div>

                    <!-- <div class="row" style="color: #222; padding: 0.75rem; margin: 0;">
                        <div class="col-md-12 text-center">
                            <button class="btn btn-outline-secondary" role="button">
                                <i class="bi bi-search" style="margin-right: 5px;"></i>Search
                            </button>
                        </div>
                    </div> -->
                </div>
            </form>

        </div>
    </div>
    <div class="row mx-2 mt-2 align-items-center" style="box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;">
        <div class="col-12 mb-2 p-1" *ngIf="showTable">
            <div class="table-responsive common_Table">
                <p class="ms-1 mt-2 mb-0"><span class="ent-date me-1"><i class="bi bi-circle-fill me-1"></i>Expense Date</span><span class="imt-date ms-2"><i class="bi bi-circle-fill me-1"></i>Entry Date</span></p>
                <table id="example" datatable [dtOptions]="dtOptions"
                    class="display table table-bordered table-striped table-hover" style="width: 100%">
                    <colgroup>
                        <col style="width: 8%" />
                        <col style="width: 10%" />
                        <col style="width: 29%" />
                        <col style="width: 40%" />
                        <col style="width: 13%" />
                    </colgroup>
                    <thead style="background-color: #69757d">
                        <tr>
                            <th class="text-center v-mid">Sl</th>
                            <th class="text-center v-mid">User</th>
                            <th class="text-center v-mid">Date</th>
                            <th class="text-center v-mid">Description</th>
                            <th class="text-center v-mid">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of returnResult; let i = index">
                            <td class="text-center v-mid" style="border-radius: 5px;"
                                [ngStyle]="{'border-left':item.TransactionTypeID===2 ? '2px solid red' : '2px solid green' }">
                                {{ i + 1 }}
                            </td>
                            <td class="text-start v-mid">{{ item.UserName }}</td>
                            <td class="text-center v-mid">
                                <p class="m-0 ent-date">{{ item.Date }}</p>
                                <p class="m-0 imt-date">{{ item.ImportDate }}</p>
                            </td>
                            <td class="text-start v-mid">{{ item.Description }}</td>
                            <td class="text-end v-mid"><i class="bi bi-currency-rupee me-1"></i>{{ item.Amount}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
